name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web y catálogo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Comprobar sintaxis y catálogo
        run: npm run check
      - name: Arrancar y probar la API
        env:
          PORT: 5173
          HOST: 127.0.0.1
        run: |
          node server.mjs &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:5173/api/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5173/api/health
          curl -fsS http://127.0.0.1:5173/api/channels | head -c 120
          echo

  native:
    name: App nativa (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Comprobar tipos
        run: npm run typecheck
